[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-dev-runner"
version = "0.2.5"
description = "Local finite development runner with guarded Drive mailbox and loopback control"
requires-python = ">=3.10"
dependencies = ["jsonschema==4.26.0", "fastapi==0.141.1", "uvicorn==0.54.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1", "httplib2==0.32.0", "google-api-python-client==2.200.0"]
dev = ["build==1.6.1", "ruff==0.16.9", "mypy==1.20.2", "httpx==0.28.1", "types-jsonschema==4.26.0.20260518", "setuptools==84.0.0", "wheel==0.48.0"]
bootstrap = ["google-api-python-client==2.200.0", "google-auth-oauthlib==1.4.1", "google-auth-httplib2==0.4.2", "httplib2==0.32.0", "google-auth==2.58.1"]
ui-test = ["playwright==1.63.0"]

[project.scripts]
runner = "runner_app.cli:main"

[tool.setuptools.packages.find]
include = ["runner_app*", "bridge_reference*", "schemas"]

[tool.setuptools.package-data]
"runner_app" = ["production.service.in"]
schemas = ["*.schema.json"]
"runner_app.git" = ["python_quick_wheels/*.whl"]
"runner_app.web" = ["index.html", "*.js", "*.css"]

[tool.ruff]
target-version = "py310"
line-length = 100
include = ["runner_app/**/*.py", "tests/test_*.py", "scripts/bootstrap_drive.py"]

[tool.mypy]
python_version = "3.10"
files = ["runner_app"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
