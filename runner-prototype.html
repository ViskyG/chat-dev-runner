:'language-lab',name:'Language Lab',initials:'LL',desc:'Небольшая мастерская слов и карточек',repo:'example/language-lab',template:'python-basic',workspaces:[{id:'dictionary',name:'Словарный адаптер',branch:'feature/dictionary',sha:'27f2ab0',dirty:1,passed:16,failed:0,skipped:0,duration:1.6,run:'run-022',stale:true,profile:'python-quick',last:'Вчера',pr:3}]}]};}
let state;try{state=JSON.parse(localStorage.getItem('cdr-demo-v3')||'null')}catch{}if(!state||state.version!==3)state=seed();

let modalData=null,returnFocus=null,toastTimer=null;const timers=new Map();let sequence=state.ops.length+28;

function render(){document.documentElement.dataset.theme=state.theme;document.documentElement.dataset.motion=state.motion?'on':'off';$('#app').innerHTML=`<div class="shell"><aside class="sidebar"><button class="brand" data-action="view" data-value="work" aria-label="Runner: рабочие области"><span class="brandmark"></span><span><strong>runner</strong><small>development atelier</small></span></button><nav aria-label="Разделы">${[['work','grid','Рабочие области'],['operations','activity','Операции'],['results','archive','Результаты'],['drive','drive','Google Drive'],['system','settings','Система']].map(([id,ic,l])=>`<button class="navitem ${state.view===id?'on':''}" data-action="view" data-value="${id}" ${state.view===id?'aria-current="page"':''}>${icon(ic)}${l}</button>`).join('')}</nav><div class="sidecap">Проекты <span>${state.projects.length}</span></div><input class="sidebar-search" placeholder="Найти проект…" aria-label="Найти проект" id="project-search"><div class="projectlist">${state.projects.map(pr=>`<button class="projectpick ${pr.id===p().id?'on':''}" data-action="project" data-value="${esc(pr.id)}"><span class="projecticon">${esc(pr.initials)}</span><span class="projectlabel">${esc(pr.name)}</span></button>`).join('')}</div><button class="btn ghost newproject" data-action="new-project">${icon('plus')} Новый проект</button><div class="sidefoot"><div class="local">${icon('shield')} Только на этом компьютере</div>127.0.0.1 · без входящих соединений<br><span style="display:block;margin-top:10px">Интерактивный прототип / 0.1</span></div></aside><main class="main"><header class="topbar"><div class="crumb">Мастерская <span>/</span> <strong>${esc(state.view==='work'?p().name:({operations:'Операции',results:'Результаты',drive:'Google Drive',system:'Система'}[state.view]))}</strong></div><div class="topcontrols"><button class="cmdkey" data-action="palette">Перейти к… <span class="kbd">Ctrl K</span></button><span class="demo-badge" title="Все проекты и сетевые действия на этом экране — демонстрация">ДЕМО · БЕЗ ПОДКЛЮЧЕНИЙ</span><button class="iconbtn" data-action="theme" aria-label="Переключить светлую и тёмную тему">${icon(state.theme==='dark'?'sun':'moon')}</button><button class="iconbtn" data-action="help" aria-label="Как устроен прототип">${icon('info')}</button></div></header><div class="mobile-project"><select id="mobile-project-select" aria-label="Выбрать проект">${state.projects.map(pr=>`<option value="${esc(pr.id)}" ${pr.id===p().id?'selected':''}>${esc(pr.name)}</option>`).join('')}</select><button class="btn ghost" data-action="new-project" aria-label="Новый проект">${icon('plus')}</button></div><div class="content fade">${state.view==='work'?workspaceView():state.view==='operations'?operationsView():state.view==='results'?resultsView():state.view==='drive'?driveView():systemView()}</div></main></div>`;save()}
function workspaceView(){const pr=p(),ws=w(),op=opFor(pr.id,ws.id),running=busy(pr.id,ws.id);return `<div class="projecthead"><div><div class="eyebrow">Локальный центр разработки</div><h1 class="pagetitle">${esc(pr.name)}</h1><p class="subtitle repo-path">${icon('github')} ${esc(pr.repo)} <span style="color:var(--quiet)">· private · пример</span></p></div><div class="actions"><button class="btn ghost" data-action="code-menu">${icon('code')} Открыть в VS Code ${icon('chevron')}</button><button class="btn primary" data-action="new-operation">${icon('play')} Новая операция</button></div></div>${healthStrip()}<div class="workspace-layout"><section class="workspaces-side"><div class="sectiontitle"><h2>Рабочие области</h2><span class="sub">отдельный worktree</span></div><div class="workspaces">${pr.workspaces.map(v=>`<article class="workspace ${v.id===ws.id?'selected':''}" tabindex="0" role="button" data-action="workspace" data-value="${esc(v.id)}" aria-label="Выбрать рабочую область ${esc(v.name)}" aria-pressed="${v.id===ws.id}"><div class="ws-top"><h3>${esc(v.name)}</h3>${v.id===ws.id?`<span style="color:var(--accent)">${icon('arrow')}</span>`:''}</div><div class="ws-sub">${icon('branch')} ${esc(v.branch)}</div><div class="ws-dirty">${icon(v.dirty?'file':'check')} ${v.dirty?`${v.dirty} файла изменены`:'Нет локальных изменений'}</div><div class="ws-last"><span>${esc(v.run||'Ещё нет запусков')} · ${esc(v.last)}</span>${busy(pr.id,v.id)?'<span class="badge blue">Выполняется</span>':v.failed?`<span class="badge warn">${v.failed} теста</span>`:v.run?'<span class="badge ok">Проверено</span>':''}</div></article>`).join('')}</div><button class="addws" data-action="new-workspace">${icon('plus')} Новая рабочая область</button><div class="side-note">Ветка — линия изменений.<br>Рабочая область — её место на диске.<br>Одну разработку не нужно закрывать,<br>чтобы начать другую.</div></section><section class="inspector" aria-label="Состояние выбранной рабочей области"><div class="inspect-head"><div><div class="eyebrow" style="margin-bottom:4px">Выбранная рабочая область</div><h2>${esc(ws.name)}</h2><span class="minor">${esc(ws.branch)} <span style="padding:0 7px">/</span> ${esc(ws.sha)}</span></div><div class="orb ${running?'running':''}" aria-hidden="true">${icon(running?'activity':'spark')}</div></div><div class="workspace-toolbar"><button class="btn small ghost" data-action="new-operation" data-value="verify">${icon('play')} Проверить</button><button class="btn small ghost" data-action="branch">${icon('branch')} Ветка</button><button class="btn small ghost" data-action="diff">${icon('gitcommit')} Изменения${ws.dirty?' · '+ws.dirty:''}</button><button class="btn small ghost" data-action="code-direct">${icon('code')} VS Code</button><button class="btn small ghost" data-action="workspace-drive">${icon('drive')} Файлы в Drive</button></div><div class="workspace-meta"><div><div class="label">Источник</div><div class="value">GitHub · приватная ветка</div></div><div><div class="label">Последний fetch</div><div class="value">${esc(state.fetchTime)} <button class="linkbtn" data-action="fetch" title="Обновить сведения о ветках; не менять файлы">↻</button></div></div><div><div class="label">Публикация</div><div class="value">${ws.pr?`Draft PR #${ws.pr} · без merge`:'Ещё не публиковалась'}</div></div></div><div class="inspect-body"><div class="runheadline"><div><strong>${running?'Операция выполняется':'Последняя операция'}</strong><p>${esc(op?.kind||'Рабочая область создана')} <span class="runid">· ${esc(op?.id||'—')}</span></p></div>${op?statusBadge(op):'<span class="badge">Нет операций</span>'}</div>${route(op)}${running?`<div class="run-note">${icon('info')}<span>Один конечный маршрут. Результат не создаёт следующую операцию. <button class="linkbtn" data-action="cancel" data-value="${esc(op.id)}">Остановить</button></span></div>`:ws.stale?`<div class="run-note warn">${icon('info')}<span>Исходники или ветка изменились после проверки. Этот результат относится к прежнему снимку.</span></div>`:`<div class="run-note">${icon('check')}<span>${ws.run?'Результат привязан к снимку '+esc(ws.testedSha||ws.sha)+'.':'Результатов проверки пока нет.'} Следующий запуск — только по новой команде.</span></div>`}</div><div class="output-tabs" role="tablist" aria-label="Результаты запуска">${[['summary','Сводка'],['console','Консоль'],['logs','Логи'],['tests','Тесты'],['artifacts','Артефакты']].map(([id,l])=>`<button class="output-tab ${state.tab===id?'on':''}" role="tab" aria-selected="${state.tab===id}" data-action="tab" data-value="${id}">${l}</button>`).join('')}</div><div class="output-content" role="tabpanel">${outputPanel(ws)}</div></section></div><div class="bottomnote">${icon('shield')} Runner обслуживает операции; замечания тестов не означают неисправность runner.</div><section class="history"><div class="sectiontitle"><h2>Недавние операции</h2><button class="linkbtn" data-action="view" data-value="operations">Вся история ${icon('arrow')}</button></div>${operationsTable(state.ops.slice(0,3))}</section>`}

function stagesFor(kind=''){
if(kind.includes('Создать проект'))return ['Права','GitHub','Локально','Worktree','Среда','Drive','Отчёт'];

}
function route(op){if(!op)return '<p class="minor">Маршрут появится после первой операции.</p>';const names=stagesFor(op.kind),steps=op.status==='completed'?names.length:op.step;return `<div class="route" style="grid-template-columns:repeat(${names.length},1fr)" aria-label="Этапы операции">${names.map((n,i)=>`<div class="step ${i<steps?'done':i===steps&&op.status==='running'?'current':''}"><span class="stepnode">${i<steps?'✓':String(i+1)}</span>${n}</div>`).join('')}</div>`}

function outputPanel(ws){if(!ws.run)return `<div class="empty-state"><span class="empty-icon">${icon('terminal')}</span><h3>Проверки ещё не запускались</h3><p class="subtitle">Рабочая область готова. Создание проекта не считается запуском тестов.</p><button class="btn ghost" data-action="new-operation" data-value="verify">Проверить снимок</button></div>`;if(state.tab==='summary')return `<div class="summary-grid"><div><div class="summary-number ${ws.failed?'warn':''}">${ws.failed||0}<span class="unit"> / ${(ws.passed||0)+(ws.failed||0)+(ws.skipped||0)}</span></div><div class="label">Тестов с замечаниями</div></div><div><div class="summary-number">${ws.duration||0}<span class="unit"> с</span></div><div class="label">Время выполнения</div></div><div><div class="summary-number">6<span class="unit"> типов</span></div><div class="label">Сохранённых результатов</div></div></div><div class="summary-foot"><span>Доставка отчёта: завершена · демонстрация</span><button class="linkbtn" data-action="report">Отчёт для чата ${icon('arrow')}</button></div>`;
if(state.tab==='console')return `<div class="log-toolbar"><span class="label">Демонстрационный вывод · UTF-8</span><div class="actions"><select id="console-stream" aria-label="Поток консоли"><option value="stdout">stdout</option><option value="stderr">stderr</option></select><button class="linkbtn" data-action="download-console">${icon('download')} Скачать</button></div></div><pre class="console" id="console-text">${esc(consoleText(ws,'stdout'))}</pre>`;
if(state.tab==='logs')return `<div class="log-toolbar"><span class="label">application-log/v1 · JSONL · пример</span><select id="log-level" aria-label="Уровень логов"><option>Все уровни</option><option>INFO</option><option>WARN</option><option>ERROR</option></select></div><pre class="console" id="app-log">${esc(logText('Все уровни'))}</pre>`;
if(state.tab==='tests')return `<div class="chip-row"><span class="badge ok">${ws.passed||0} пройдено</span><span class="badge warn">${ws.failed||0} замечаний</span><span class="badge">${ws.skipped||0} пропущено</span><span class="badge">JUnit XML</span></div>${ws.failed?['test_incremental_load','test_empty_batch'].map(t=>`<button class="testline linkbtn" style="width:100%;text-align:left" data-action="traceback" data-value="${t}"><span class="mono">tests/test_loader.py::${t}</span><span class="badge warn">AssertionError</span></button>`).join(''):'<p class="subtitle">В этом демонстрационном запуске замечаний нет.</p>'}<div class="summary-foot">Тестовый результат и исполнение операции — разные статусы.</div>`;
return `<div class="artifact-list">${[['report','file','Отчёт для чата','Markdown · 3.1 KB'],['junit','check','Результат тестов','JUnit XML · 14 KB'],['coverage','activity','Покрытие','Cobertura XML · 38 KB'],['screen','grid','Снимок интерфейса','SVG · образец'],['manifest','log','Манифест запуска','JSON · демо'],['bundle','archive','Набор результатов','JSON · демо-экспорт']].map(([id,ic,n,d])=>`<button class="artifact" data-action="artifact" data-value="${id}">${icon(ic)}<span><strong>${n}</strong><small>${d}</small></span></button>`).join('')}</div>`}
function consoleText(ws,stream){return stream==='stderr'?(ws.failed?'AssertionError: expected 2 records, received 3\n\nThis is synthetic demo output. No local test was executed.':'[stderr empty]\nDemonstration only.'):`$ python -m pytest --junitxml=out/junit.xml\nplatform linux · Python 3.x · profile ${ws.profile}\ncollected ${(ws.passed||0)+(ws.failed||0)+(ws.skipped||0)} items\n\ntests/test_loader.py ..........${ws.failed?'FF':''}\ntests/test_models.py ..................\n\n${ws.failed||0} failed, ${ws.passed||0} passed, ${ws.skipped||0} skipped in ${ws.duration||0}s\n\n[runner] captured stdout, stderr, junit, logs, artifacts\n[runner] report published — demo simulation only`}
function logText(level){return [{ts:'09:37:18',level:'INFO',event:'batch.started',service:'loader',run_id:'run-028'},{ts:'09:37:19',level:'WARN',event:'input.empty',service:'loader',rows:0},{ts:'09:37:20',level:'ERROR',event:'assertion.failed',service:'loader',expected:2,actual:3}].filter(x=>level==='Все уровни'||x.level===level).map(x=>JSON.stringify(x)).join('\n')}
function operationsTable(ops){return `<div class="tablewrap"><table class="table"><thead><tr><th>Операция / время</th><th>Разработка</th><th>Действие</th><th>Исполнение</th><th>Результат проекта</th></tr></thead><tbody>${ops.map(o=>`<tr class="clickable" tabindex="0" data-action="op-detail" data-value="${esc(o.id)}"><td><span class="runid">${esc(o.id)}</span><small>${esc(o.at)}</small></td><td>${esc(o.project)}<small>${esc(o.workspace||'Создание проекта')}</small></td><td>${esc(o.kind)}</td><td>${statusBadge(o)}</td><td>${o.status==='running'?'<span class="badge">Пока неизвестен</span>':outcomeBadge(o.outcome)}</td></tr>`).join('')||'<tr><td colspan="5">Операций пока нет.</td></tr>'}</tbody></table></div>`}
function operationsView(){return `<div class="fullhead"><div><div class="eyebrow">Прозрачная история действий</div><h1 class="pagetitle">Операции</h1><p class="subtitle">Один запрос — один конечный маршрут. Занятая область не ставит запрос в очередь.</p></div><button class="btn primary" data-action="new-operation">${icon('plus')} Новая операция</button></div><div class="log-toolbar"><div class="chip-row"><span class="badge">${state.ops.length} записей в демо</span><span class="badge">Без автоповторов</span></div><select id="op-filter" aria-label="Фильтр операций" style="max-width:230px"><option value="all">Все проекты</option>${state.projects.map(pr=>`<option value="${esc(pr.id)}">${esc(pr.name)}</option>`).join('')}</select></div><div id="operations-table">${operationsTable(state.ops)}</div><div class="callout">«Завершена» означает, что runner выполнил свою работу. Тесты могут завершиться с замечаниями — их результат указан отдельно.</div>`}
function resultsView(){return `<div class="fullhead"><div><div class="eyebrow">Снимок · выполнение · свидетельства</div><h1 class="pagetitle">Результаты</h1><p class="subtitle">Не только тесты: консоль, структурированные логи, отчёты и файлы.</p></div><button class="btn ghost" data-action="export-all">${icon('download')} Выгрузить демо-манифест</button></div><div class="twocol">${state.projects.flatMap(pr=>pr.workspaces.filter(ws=>ws.run).map(ws=>`<div class="card"><div class="sectiontitle"><span class="runid">${esc(ws.run)} · ${esc(pr.name)}</span>${outcomeBadge(ws.failed?'failed':'passed')}</div><h2>${esc(ws.name)}</h2><p class="mono">${esc(ws.branch)} @ ${esc(ws.sha)}</p><div class="chip-row"><span class="badge">stdout / stderr</span><span class="badge">JSONL</span><span class="badge">JUnit</span><span class="badge">Артефакты</span></div><div class="summary-foot"><span>${ws.stale?'Снимок старше текущих исходников':'Снимок соответствует исходникам'}</span><button class="linkbtn" data-action="inspect-run" data-project="${esc(pr.id)}" data-value="${esc(ws.id)}">Открыть ${icon('arrow')}</button></div></div>`)).join('')}</div>`}
function driveView(){return `<div class="fullhead"><div><div class="eyebrow">Связь с чатом без доступа к компьютеру извне</div><h1 class="pagetitle">Google Drive</h1><p class="subtitle">Команды, изменения и результаты живут отдельно. Git остаётся историей исходников.</p></div><button class="btn ghost" data-action="poll">${icon('refresh')} Проверить команды</button></div><div class="twocol"><div class="card"><h2>Рабочее пространство</h2><pre class="tree">Chat-Dev Runner/
  00-control/
    START HERE
    CHAT PROTOCOL
    ROOT COMMAND       ← создать проект
    ROOT RECEIPT       → результат
  01-projects/
    home-dwh/
      PROJECT STATE
      PROJECT COMMAND  ← создать область
      PROJECT RECEIPT
      rc-dashboard/
        COMMAND        ← одна операция
        CHANGESET      ← содержимое файлов
        RECEIPT        → отчёт о приёме
        LATEST RESULT  → результат выполнения
  02-results/
    operation-id/run-id/…
  03-contracts/</pre><button class="btn small ghost" data-action="export-request">${icon('download')} Пример команды JSON</button></div><div><div class="card"><h2>Что именно синхронизируется</h2><div class="definition"><strong>Drive → локально</strong><span>Снимок команды и явно перечисленные изменения. Не весь каталог.</span></div><div class="definition"><strong>GitHub → локально</strong><span>Fetch получает состояние веток. Обновление файлов — отдельное действие.</span></div><div class="definition"><strong>Локально → GitHub</strong><span>Коммит нужного снимка, push рабочей ветки и draft PR.</span></div><div class="definition"><strong>Локально → Drive</strong><span>Краткая сводка, манифест и разрешённые результаты.</span></div></div><div class="card"><h2>Граница одной операции</h2><p>Чат записывает команду и завершает ход. Runner выполняет фиксированный маршрут и возвращает отчёт. Новая итерация начинается только по новому запросу пользователя.</p><p class="notice">Документы созданы runner-приложением. Доступ ChatGPT и OAuth-доступ runner — два независимых разрешения.</p><button class="btn small ghost" data-action="protocol">Открыть инструкцию для чата ${icon('arrow')}</button></div></div></div>`}
function systemView(){return `<div class="fullhead"><div><div class="eyebrow">Меньше шума. Больше ясности.</div><h1 class="pagetitle">Система</h1><p class="subtitle">Настройки прототипа действуют только в этом браузере.</p></div><span class="badge ${state.fault?'bad':'ok'}">${state.fault?'Сбой GitHub-соединения · демо':'Runner исправен · демо'}</span></div><div class="twocol"><div class="card"><h2>Комфорт</h2><div class="setting-row"><div><strong>Тёмная мастерская</strong><p>Тёплый графит, шалфейные акценты и тихий свет.</p></div><button class="toggle ${state.theme==='dark'?'on':''}" role="switch" aria-checked="${state.theme==='dark'}" aria-label="Тёмная тема" data-action="theme"></button></div><div class="setting-row"><div><strong>Мягкое движение</strong><p>Системная настройка reduced motion имеет приоритет.</p></div><button class="toggle ${state.motion?'on':''}" role="switch" aria-checked="${state.motion}" aria-label="Анимации" data-action="motion"></button></div><div class="setting-row"><div><strong>Демонстрация сбоя runner</strong><p>Отдельно от замечаний в тестах проекта.</p></div><button class="toggle ${state.fault?'on':''}" role="switch" aria-checked="${state.fault}" aria-label="Демонстрация сбоя runner" data-action="fault"></button></div></div><div class="card"><h2>Границы будущего сервиса</h2><div class="definition"><strong>Интерфейс</strong><span>127.0.0.1; проверка Host, Origin и сессионного токена.</span></div><div class="definition"><strong>Выполнение</strong><span>Изолированный снимок без GitHub/Drive-секретов.</span></div><div class="definition"><strong>Параллельность</strong><span>Разные workspaces; занятое место → REJECTED_BUSY. Без ожидания.</span></div><div class="definition"><strong>Публикация</strong><span>Commit + push + draft PR в разрешённом пространстве веток.</span></div><div class="definition"><strong>Внешняя сеть</strong><span>Только исходящие соединения адаптеров.</span></div></div></div><div class="card"><h2>Состояние демонстрации</h2><p>Интерфейс сохраняет выбранный проект, тему и демонстрационные действия в localStorage. Здесь нет облачных токенов, shell-команд или реального подключения. Перезагрузка не возобновляет прерванные операции.</p><div class="actions"><button class="btn ghost" data-action="export-all">${icon('download')} Экспорт состояния</button><button class="btn danger ghost" data-action="reset">Сбросить демо</button><button class="btn ghost" data-action="help">Что уже работает?</button></div></div>`}

function exampleRequest(){return {schema_version:'1.0',request_id:crypto.randomUUID?crypto.randomUUID():`demo-${Date.now()}`,dispatch:'DRAFT',runner_id:'local-runner',epoch:'SET_BY_RUNNER',issued_at:new Date().toISOString(),expires_at:new Date(Date.now()+900000).toISOString(),action:'DELIVER_VERIFY_PUBLISH',project_id:p().id,workspace_id:w().id,expected_head:'REPLACE_WITH_FULL_40_OR_64_HEX_SHA',params:{changeset_doc_id:'SET_BY_BOOTSTRAP',changeset_revision:'READ_FROM_DOCS',profile_id:w().profile,publication:'draft_always'},intent:'Apply the explicitly reviewed changes, verify once, publish the branch and return evidence.'}}

if(m.kind==='new-project'){title=m.step===2?'Всё готово к созданию':'Новый проект';sub='Один маршрут: локальная копия + GitHub + рабочие документы Drive.';if(m.step===2){body=`<div class="callout">${esc(m.name)} · <span class="mono">${esc(m.id)}</span><br>Репозиторий приватный. Токены не передаются в код проекта.</div><ol class="stage-list">${['Проверить профиль и права','Создать или подключить репозиторий GitHub','Подготовить локальный проект','Создать первую рабочую область','Создать документы Drive','Сохранить манифест и вернуть отчёт'].map((x,i)=>`<li><span class="n">${i+1}</span>${x}</li>`).join('')}</ol><p class="subtitle">Доступ ChatGPT к новому репозиторию: отдельная настройка подключения; не блокирует создание.</p>`;foot=`<button class="btn ghost" data-action="project-back">Назад</button><button class="btn primary" data-action="create-project">Создать в демонстрации ${icon('arrow')}</button>`}else{m.mode=m.mode||'new';body=`<div class="choice-grid">${[['new','spark','С нуля','Новая локальная разработка'],['github','github','Из GitHub','Подключить репозиторий'],['local','folder','С компьютера','Не трогая исходную копию']].map(([id,ic,l,d])=>`<button class="choice ${m.mode===id?'on':''}" data-action="project-mode" data-value="${id}">${icon(ic)}<strong>${l}</strong><small>${d}</small></button>`).join('')}</div><label class="field"><span>Название проекта</span><input id="new-name" maxlength="60" value="${esc(m.name||'Новая мастерская')}" placeholder="Например, Notes Lab"></label><label class="field"><span>Project ID — постоянный адрес проекта</span><input id="new-id" maxlength="48" value="${esc(m.id||'notes-lab')}" pattern="[a-z0-9][a-z0-9-]*"><small>Строчные латинские буквы, цифры и дефисы.</small></label>${m.mode==='github'?'<label class="field"><span>GitHub owner/repository</span><input id="new-source" value="example/notes-lab"><small>В демо адрес не используется для сетевого запроса.</small></label>':m.mode==='local'?'<label class="field"><span>Локальная папка — только через локальный UI</span><input id="new-source" value="~/Work/notes-lab"><small>Чат использует заранее выданный import_handle, а не произвольный путь.</small></label>':''}<label class="field"><span>Профиль окружения</span><select id="new-template"><option value="python-basic">Python · unittest / pytest</option><option value="node-basic">Node · тесты и сборка</option><option value="files-only">Только файлы · без выполнения</option></select></label><div class="run-note">${icon('shield')}Все действия на этом экране — симуляция. Реальные папки и репозитории не создаются.</div>`;foot=`<small>Приватность: private по умолчанию</small><button class="btn primary" data-action="project-next">Проверить маршрут ${icon('arrow')}</button>`}}
else if(m.kind==='new-workspace'){title='Новая рабочая область';sub='Ещё одна разработка того же проекта, без переключения соседних.';body=`<label class="field"><span>Название</span><input id="ws-name" value="Новый эксперимент" maxlength="60"></label><label class="field"><span>Workspace ID</span><input id="ws-id" value="experiment-${p().workspaces.length}" maxlength="48"></label><label class="field"><span>Новая ветка</span><input id="ws-branch" value="feature/experiment-${p().workspaces.length}" maxlength="120"></label><label class="field"><span>Основание</span><select id="ws-base">${p().workspaces.map(ws=>`<option value="${esc(ws.sha)}">${esc(ws.branch)} @ ${esc(ws.sha)}</option>`).join('')}</select></label><p class="subtitle">Git worktree отделяет рабочие файлы. Окружение тестов создаётся отдельно; worktree не является песочницей.</p>`;foot=`<small>Один проект · несколько независимых областей</small><button class="btn primary" data-action="create-workspace">Создать в демо ${icon('plus')}</button>`}
else if(m.kind==='operation'){title='Новая операция';sub=`${p().name} / ${w().name}`;body=`<label class="field"><span>Маршрут</span><select id="operation-kind"><option value="full" ${m.preset==='verify'?'':'selected'}>Доставить → проверить → опубликовать → вернуть отчёт</option><option value="verify" ${m.preset==='verify'?'selected':''}>Проверить текущий снимок → вернуть отчёт</option><option value="publish">Опубликовать снимок → draft PR → вернуть отчёт</option></select></label><div class="definition"><strong>Ветка</strong><span class="mono">${esc(w().branch)}</span></div><div class="definition"><strong>Основание</strong><span class="mono">${esc(w().sha)} · снимок фиксируется до выполнения</span></div><div class="definition"><strong>Профиль</strong><span>${esc(w().profile)} · команда из доверенной конфигурации</span></div><div class="definition"><strong>Публикация</strong><span>В рабочую ветку; draft PR даже при замечаниях тестов. Merge не выполняется.</span></div><label class="field"><span>Демонстрационный результат тестов</span><select id="test-outcome"><option value="passed">Все проверки пройдены</option><option value="failed">Два теста с замечаниями</option></select></label><div class="run-note">${icon('info')}Занятое рабочее место → отказ BUSY. Никакого отложенного запуска.</div>${busy(p().id,w().id)?'<div class="errorline">Эта область уже занята. Следующая операция не будет поставлена в очередь.</div>':''}`;foot=`<button class="btn ghost" data-action="export-request">Скачать пример запроса</button><button class="btn primary" data-action="start-operation">${icon('play')} Выполнить в демо</button>`}
else if(m.kind==='code'){title='Открыть в VS Code';sub='Выбери рабочую область, а не абстрактную «текущую ветку проекта».';body=`<div class="menu-list">${p().workspaces.map(ws=>`<button class="menu-item" data-action="show-code-path" data-value="${esc(ws.id)}"><span><strong>${esc(ws.name)}</strong><small>${esc(ws.branch)} · ${esc(ws.id)}</small></span>${icon('external')}</button>`).join('')}</div>`;foot='<small>Прототип покажет путь. Локальный редактор из браузера не запускается.</small>'}

else if(m.kind==='op-detail'){const o=state.ops.find(o=>o.id===m.id);title=`Операция ${o.id}`;sub=`${o.project} / ${o.workspace}`;body=`<div class="chip-row">${statusBadge(o)}${outcomeBadge(o.outcome)}</div><div style="margin-top:24px">${route(o)}</div><div class="definition"><strong>Маршрут</strong><span>${esc(o.kind)}</span></div><div class="definition"><strong>Повтор</strong><span>Только новый request_id; этот запрос повторно не исполняется.</span></div><div class="definition"><strong>Режим</strong><span>Симуляция UI. Внешних побочных эффектов нет.</span></div>`;foot=`<button class="btn ghost" data-action="download-op" data-value="${esc(o.id)}">Манифест ${icon('download')}</button>${o.status==='running'?`<button class="btn danger" data-action="cancel" data-value="${esc(o.id)}">Остановить</button>`:''}`}
else if(m.kind==='palette'){title='Перейти к…';sub='Ctrl K · Escape для закрытия';body=`<input id="palette-search" aria-label="Поиск раздела" placeholder="Раздел или рабочая область…" style="margin-bottom:15px"><div class="menu-list" id="palette-items">${[['work','Рабочие области'],['operations','Операции'],['results','Результаты'],['drive','Google Drive'],['system','Система']].map(([v,l])=>`<button class="menu-item" data-action="palette-view" data-value="${v}">${l}${icon('arrow')}</button>`).join('')}${p().workspaces.map(ws=>`<button class="menu-item" data-action="palette-workspace" data-value="${esc(ws.id)}">${esc(ws.name)}<span class="mono">${esc(ws.branch)}</span></button>`).join('')}</div>`}
else if(m.kind==='help'){title='Рабочая мастерская, не пульт тревог';sub='Chat-Dev Runner · интерактивный прототип 0.1';body=`<p class="subtitle" style="margin-top:0;line-height:1.9">Здесь можно создать демонстрационный проект, открыть параллельную разработку, пройти конечный маршрут проверки и публикации, посмотреть типизированные результаты и сменить оформление.</p><div class="callout">Сначала выбери область. Затем инициируй одну операцию. Отчёт вернётся, но следующая операция не начнётся сама.</div><div class="definition"><strong>Реально в прототипе</strong><span>Навигация, формы, проверки, локальное состояние, экспорт JSON, остановка анимации операции.</span></div><div class="definition"><strong>Симулируется</strong><span>Git, Drive, VS Code, PR, запуск кода, метрики тестов.</span></div><div class="definition"><strong>В архиве отдельно</strong><span>Проверяемое Python-ядро, локальный пример с настоящими Git worktrees и тестами, протоколы и пакеты Codex.</span></div><p class="subtitle">Никаких CDN, внешних шрифтов, аналитики или обращения к модели. Состояние хранится только в этом браузере.</p>`;foot='<small>Тёмная / светлая тема · reduced motion · клавиатурная навигация</small>'}
else{title=m.title||'Сведения';sub=m.sub||'Демонстрационные данные';wide=Boolean(m.wide);body=`<textarea readonly aria-label="Содержимое" style="min-height:300px">${esc(m.text||'')}</textarea>`;foot=`<small>Выдели текст или сохрани его.</small><button class="btn ghost" data-action="download-modal">${icon('download')} Скачать</button>`}

const validId = x=>/^[a-z0-9][a-z0-9-]{0,47}$/.test(x);
const validBranch = x=>x.length<=120&&/^[A-Za-z0-9][A-Za-z0-9_./-]*$/.test(x)&&!x.includes('..')&&!x.includes('//')&&!x.includes('@{')&&!x.endsWith('/')&&!x.endsWith('.lock')&&!x.endsWith('.')&&!x.split('/').some(c=>c.startsWith('.'));
function runDemo(kind,outcome,project=state.project,workspace=state.workspace){if(busy(project,workspace)){toast('REJECTED_BUSY: рабочая область занята. Запрос не сохранён для последующего запуска.');return false}if(state.ops.filter(o=>o.status==='running').length>=2){toast('REJECTED_BUSY: оба демонстрационных слота заняты. Очереди нет.');return false}const id=`op-${String(++sequence).padStart(3,'0')}`;const o={id,project,workspace,kind,status:'running',outcome:'not_run',at:now().slice(0,5),step:0,stageCount:stagesFor(kind).length};state.ops.unshift(o);closeModal();render();let tick=0;const t=setInterval(()=>{if(o.status!=='running'){clearInterval(t);timers.delete(id);return}tick++;o.step=tick;if(tick>=o.stageCount){o.status='completed';o.outcome=outcome;const pr=state.projects.find(pr=>pr.id===project),ws=pr?.workspaces.find(v=>v.id===workspace);if(ws){
const publishes=kind.includes('опубликовать')||kind.startsWith('Опубликовать');
if(outcome!=='not_run'){
const total=Math.max(12,(ws.passed||0)+(ws.failed||0));
ws.run='run-'+id.slice(3);ws.last=now().slice(0,5);ws.stale=false;ws.failed=outcome==='failed'?2:0;ws.passed=total-ws.failed;ws.duration=24.6;
if(kind.startsWith('Доставить')){ws.sha=Math.random().toString(16).slice(2,9).padEnd(7,'0');ws.dirty=0;}
ws.testedSha=ws.dirty?'snapshot-'+id:ws.sha;
}
if(publishes)ws.pr=ws.pr||18;
}state.driveTime=now();clearInterval(t);timers.delete(id);toast('Демонстрация завершена. Отчёт готов; следующая операция сама не начнётся.')}render();if(modalData?.kind==='op-detail')renderModal()},650);timers.set(id,t);return true}

function modalError(t){const b=$('.modalbody');let e=b.querySelector('.form-error');if(!e){e=document.createElement('div');e.className='errorline form-error';e.setAttribute('role','alert');b.prepend(e)}e.textContent=t}

document.addEventListener('change',e=>{if(e.target.id==='mobile-project-select'){state.project=e.target.value;state.workspace=p().workspaces[0].id;state.view='work';render();return}if(e.target.id==='console-stream')$('#console-text').textContent=consoleText(w(),e.target.value);if(e.target.id==='log-level')$('#app-log').textContent=logText(e.target.value);if(e.target.id==='op-filter')$('#operations-table').innerHTML=operationsTable(state.ops.filter(o=>e.target.value==='all'||o.project===e.target.value))});

switch(a){case'view':state.view=v;render();break;case'project':state.project=v;state.workspace=p().workspaces[0].id;state.view='work';state.tab='summary';render();break;case'workspace':state.workspace=v;state.tab='summary';render();break;case'tab':state.tab=v;render();break;case'theme':state.theme=state.theme==='dark'?'light':'dark';render();break;case'motion':state.motion=!state.motion;render();break;case'fault':state.fault=!state.fault;render();break;case'help':openModal('help');break;case'palette':openModal('palette');break;case'palette-view':closeModal();state.view=v;render();break;case'palette-workspace':closeModal();state.workspace=v;state.view='work';render();break;case'close-modal':closeModal();break;case'backdrop':if(e.target===el)closeModal();break;
case'new-project':openModal('new-project');break;case'project-mode':modalData.name=$('#new-name').value;modalData.id=$('#new-id').value;modalData.mode=v;renderModal();break;case'project-next':{const name=$('#new-name').value.trim(),id=$('#new-id').value.trim();if(!name||!validId(id)){modalError('Укажи название и корректный ID: a–z, 0–9, дефис; не больше 48 символов.');break}if(state.projects.some(x=>x.id===id)){modalError('Проект с таким ID уже существует.');break}Object.assign(modalData,{name,id,template:$('#new-template').value,source:$('#new-source')?.value,step:2});renderModal();break}case'project-back':modalData.step=1;renderModal();break;case'create-project':{if(state.ops.filter(o=>o.status==='running').length>=2){modalError('Оба слота заняты. Проект не создан; очереди нет.');break}const m={...modalData};const pr={id:m.id,name:m.name,initials:m.name.replace(/[^\p{L}\p{N}]/gu,'').slice(0,2).toUpperCase(),desc:'Новый демонстрационный проект',repo:`example/${m.id}`,template:m.template,workspaces:[{id:'baseline',name:'Основная линия',branch:'main',sha:'d3e012a',dirty:0,passed:0,failed:0,skipped:0,duration:0,run:null,stale:false,profile:m.template==='files-only'?'files-only':m.template==='node-basic'?'node-test':'python-quick',last:'Только что',pr:null}]};state.projects.push(pr);state.project=m.id;state.workspace='baseline';state.view='work';runDemo('Создать проект локально · GitHub · Drive','not_run',m.id,'baseline');break}
case'new-workspace':openModal('new-workspace');break;case'create-workspace':{if(state.ops.filter(o=>o.status==='running').length>=2){modalError('Оба слота заняты. Рабочая область не создана; очереди нет.');break}const name=$('#ws-name').value.trim(),id=$('#ws-id').value.trim(),branch=$('#ws-branch').value.trim();if(!name||!validId(id)||!validBranch(branch)){modalError('Проверь название, ID и имя ветки.');break}if(p().workspaces.some(ws=>ws.id===id||ws.branch===branch)){modalError('ID или ветка уже заняты. Для одной ветки не создаём второй активный worktree.');break}p().workspaces.push({id,name,branch,sha:$('#ws-base').value,dirty:0,passed:0,failed:0,skipped:0,duration:0,run:null,stale:false,profile:w().profile,last:'Только что',pr:null});state.workspace=id;runDemo('Создать рабочую область','not_run');break}
case'new-operation':openModal('operation',{preset:v});break;case'start-operation':{const mode=$('#operation-kind').value,outcome=$('#test-outcome').value;if(mode!=='verify'&&w().branch==='main'){modalError('Основная ветка защищена. Создай рабочую область с feature-веткой для публикации.');break}if(mode!=='publish'&&w().profile==='files-only'){modalError('У проекта нет разрешённого профиля выполнения. Это область только для файлов.');break}if(mode==='publish'&&!w().run){modalError('Нет проверенного снимка source_run_id. Сначала нужен отдельный запуск проверки.');break}runDemo(mode==='verify'?'Проверить текущий снимок':mode==='publish'?'Опубликовать снимок · draft PR':'Доставить · проверить · опубликовать',mode==='publish'?'not_run':outcome);break}case'cancel':{const o=state.ops.find(x=>x.id===v);if(o?.status==='running'){o.status='cancelled';clearInterval(timers.get(v));timers.delete(v);closeModal();render();toast('Демонстрация остановлена. В реальном сервисе выполненные публикации не откатываются автоматически.')}break}
case'code-menu':openModal('code');break;case'code-direct':case'show-code-path':{const ws=a==='code-direct'?w():p().workspaces.find(x=>x.id===v);openModal('text',{title:`VS Code · ${ws.name}`,text:`DEMO — editor is not launched.\n\n~/.local/share/chat-dev-runner/projects/${p().id}/workspaces/${ws.id}\n\nThe live backend resolves workspace_id to an allowlisted local path and invokes VS Code with an argv array. It never executes a command from a Drive document.`});break}
case'branch':openModal('branch');break;case'switch-branch':{const b=$('#target-branch').value.trim();if(!validBranch(b)||p().workspaces.some(x=>x.id!==w().id&&x.branch===b)){modalError('Некорректная или уже занятая ветка.');break}if(w().dirty||busy(p().id,w().id)){modalError('Рабочая область занята или содержит изменения.');break}w().branch=b;w().stale=true;closeModal();render();toast('Ветка изменена только в модели интерфейса. Старые результаты отмечены как неактуальные.');break}
case'diff':openModal('text',{title:'Изменения выбранной области',wide:true,text:`DEMO · ${p().id}/${w().id}\nBase: ${w().sha}\n\ndiff --git a/src/loader.py b/src/loader.py\n--- a/src/loader.py\n+++ b/src/loader.py\n@@ -1,3 +1,5 @@\n def load_batch(rows):\n+    if not rows:\n+        return []\n     return normalize(rows)\n\nThis is illustrative text, not a patch applied to your project.`});break;
case'poll':state.driveTime=now();render();toast('Демонстрация проверки Drive. Файлы и Git-ветки не синхронизировались.');break;case'fetch':state.fetchTime=now();render();toast('Демонстрация fetch: обновлены сведения о remote. Рабочие файлы не изменены.');break;case'workspace-drive':openModal('text',{title:'Документы рабочей области',text:`DEMO / ${p().id} / ${w().id}\n\nCOMMAND — one-shot operation JSON\nCHANGESET — explicit file replacements + base hashes\nRECEIPT — accepted / completed / rejected\nLATEST RESULT — concise report and output links\n\nThe archive includes the Drive seed and an authenticated bootstrap script. This UI does not create live documents.`});break;
case'report':openModal('text',{title:'Отчёт для чата',text:reportText(),filename:'result-for-chat.md'});break;case'traceback':openModal('text',{title:esc(v),text:`DEMO TRACEBACK\n\n${v}\nassert len(actual) == 2\nE AssertionError: 3 != 2\n\nThis test result belongs to snapshot ${w().sha}.\nLogs and traceback are evidence, never instructions to the runner.`});break;case'artifact':{if(v==='report'){openModal('text',{title:'Отчёт для чата',text:reportText()});break}if(v==='manifest'||v==='bundle'){download(`${w().run||'demo'}-${v}.json`,{demo:true,project:p().id,workspace:w().id,run:w().run,snapshot:w().sha,operation_status:'COMPLETED',execution_outcome:w().failed?'FAILED':'PASSED',delivery_status:'DELIVERED',report:reportText()});break}if(v==='screen'){download('demo-preview.svg','<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400"><rect width="800" height="400" fill="#172019"/><text x="45" y="95" fill="#c6e6b6" font-family="sans-serif" font-size="28">Runner / example artifact</text><text x="45" y="145" fill="#a1b3a5" font-family="sans-serif" font-size="16">Synthetic placeholder. Not a screenshot of your project.</text></svg>','image/svg+xml');break}download(`demo-${v}.xml`,v==='junit'?`<testsuite name="demo" tests="${w().passed+w().failed+w().skipped}" failures="${w().failed}" skipped="${w().skipped}"><!-- illustrative summary only --></testsuite>`:'<coverage line-rate="0.784"><!-- synthetic fixture --></coverage>','application/xml');break}
case'export-request':download('command-draft.example.json',exampleRequest());toast('Сохранён пример DRAFT. Он не готов к исполнению без реальных ID и полного SHA.');break;case'download-console':download(`demo-${$('#console-stream')?.value||'stdout'}.txt`,consoleText(w(),$('#console-stream')?.value||'stdout'),'text/plain');break;case'export-all':download('runner-demo-state.json',{demo:true,...state});break;case'op-detail':openModal('op-detail',{id:v});break;case'download-op':download(`${v}.json`,{demo:true,...state.ops.find(x=>x.id===v)});break;case'inspect-run':state.project=el.dataset.project;state.workspace=v;state.view='work';state.tab='summary';render();break;case'download-modal':download(modalData.filename||'demo-information.txt',modalData.text||'','text/plain');break;case'protocol':openModal('text',{title:'Протокол для чата — краткая версия',text:'1. Read START HERE, current PROJECT STATE and workspace RECEIPT.\n2. Confirm the user requested this operation.\n3. Read base SHA and revision IDs.\n4. Write CHANGESET; validate paths, sizes and base hashes.\n5. Write COMMAND with a new request_id, dispatch=DRAFT and expiry.\n6. Re-read; use Docs revision guard; publish dispatch=READY last.\n7. End this turn. Do not poll for tests, repair code or issue another operation.\n8. In a later user turn, read RECEIPT and LATEST RESULT.\n\nBusy/expired/rejected means terminal, not queued.\nNo secret values or local shell commands belong in these documents.'});break;case'reset':openModal('text',{title:'Сброс демонстрации',text:'Для сброса нажми кнопку ниже. Удаляется только состояние прототипа из localStorage; файлы компьютера не затрагиваются.'});$('.modalfoot').innerHTML='<button class="btn danger" data-action="confirm-reset">Сбросить локальную демонстрацию</button>';break;case'confirm-reset':for(const t of timers.values())clearInterval(t);timers.clear();state=seed();closeModal();render();toast('Демонстрационные данные восстановлены.');break;
